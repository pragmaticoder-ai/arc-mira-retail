[project]
name = "arc-mira-retail"
version = "1.0.0"
description = "ARC — Agentic Retail Command for MIRA Retail"
requires-python = ">=3.11"

dependencies = [
  # Agent framework
  "google-adk>=1.0.0",
  
  # Google Cloud
  "google-cloud-aiplatform>=1.60.0",
  "google-cloud-bigquery>=3.20.0",
  "google-cloud-bigquery-storage>=2.25.0",
  "google-cloud-alloydb-connector>=1.0.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-logging>=3.10.0",
  
  # Database
  "pg8000>=1.31.0",
  "sqlalchemy>=2.0.0",
  
  # API framework
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "slowapi>=0.1.9",
  
  # Auth
  "google-auth>=2.29.0",
  "google-auth-httpx>=0.1.0",
  
  # Data validation
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  
  # HTTP client
  "httpx>=0.27.0",
  
  # Utilities
  "python-dotenv>=1.0.0",
  "structlog>=24.2.0",
  "tenacity>=8.3.0",
]

[dependency-groups]
dev = [
  # Testing
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "respx>=0.21.0",
  "factory-boy>=3.3.0",
  "faker>=25.0.0",
  
  # Testcontainers
  "testcontainers>=4.7.0",
  
  # Linting / typing
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tools --cov-report=term-missing"
markers = [
  "unit: pure unit tests, no external dependencies",
  "integration: requires Docker + Testcontainers",
  "contract: validates tool I/O against AGENT_CONTRACTS.md",
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*", "*/__init__.py"]
